<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Bracket — Clash Royale Championship</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  <header>
    <div class="main-logo brand-logo" aria-label="Clash Royale">
      <img class="brand-image" src="https://www.freeiconspng.com/download/46160" alt="Clash Royale">
    </div>
  </header>

  <div id="setup-screen" class="setup-container">
    <h2>Enter Challengers</h2>
    <p>Summon the 16 players to generate the grand bracket.</p>
    <div id="inputs-grid" class="grid-names"></div>
    <div class="actions">
      <button class="btn-secondary" id="btn-fill">Auto-Fill Demo</button>
      <button class="btn-primary" id="btn-start">Battle Start!</button>
    </div>
  </div>

  <div id="bracket-screen" class="hidden" style="width: 100%;">
    <button class="btn-danger tournament-reset" id="btn-reset" type="button">Reset Tournament</button>
    <div class="bracket-wrapper" id="bracket-wrapper">
      <svg id="lines-layer"></svg>
      <div class="col round-r16" id="col-L-1"></div>
      <div class="col round-qf" id="col-L-2"></div>
      <div class="col round-sf" id="col-L-3"></div>
      <div class="col col-center round-gf" id="col-C-4"></div>
      <div class="col round-sf" id="col-R-3"></div>
      <div class="col round-qf" id="col-R-2"></div>
      <div class="col round-r16" id="col-R-1"></div>
      
      <div id="champion-splash" class="champion-reveal">
        <div class="rays"></div>
        <img class="champion-crowns" src="crowns.svg" alt="Three crowns">
        <h3>Grand Champion</h3>
        <div class="champ-name" id="champion-name">Name</div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
